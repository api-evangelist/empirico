aid: empirico
name: Empirico
description: Empirico is a biotechnology company that powers therapeutic discovery with
  human genetics and small interfering RNA (siRNA) medicines. Combining internal capabilities
  in human genetics and siRNA chemistry with partner expertise, the company identifies
  naturally occurring genetic variations associated with health benefits and develops
  precision oligonucleotide therapeutics for common diseases with significant unmet
  medical need. In October 2024 Empirico entered a licensing agreement with GSK worth
  up to $745 million for a clinical-stage oligonucleotide targeting respiratory disease
  (COPD). Empirico is backed by DCVC. It is a pharmaceutical R&D company and does not
  operate a public technology or API platform.
